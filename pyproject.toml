[project]
name = "baseai"
version = "0.0.2"
description = "A simple personal AI assistant"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "langchain>=1.2.10",
    "langchain-core>=1.2.16",
    "langchain-mcp-adapters>=0.2.1",
    "langchain-openai>=1.1.10",
    "langgraph>=1.0.10",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "langchain-ollama>=1.0.1",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["baseai"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
